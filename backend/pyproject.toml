[project]
name = "app"
version = "0.1.0"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.14",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "simpy>=4.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "ocpp>=2.0",
    "websockets>=12.0",
]
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "matplotlib>=3.8",
    "mlflow>=2.10",
    "pandapower>=2.14",
    "torch>=2.0",
]
